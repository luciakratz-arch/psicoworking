<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Paciente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: linear-gradient(150deg, #EADDFC 0%, #F3F4F6 60%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      color: #1F1B2E;
    }
    .cartao { background: white; border-radius: 20px; padding: 32px; width: 100%; max-width: 560px; box-shadow: 0 8px 40px rgba(106,43,217,0.14); }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .subtitulo { font-size: 13px; color: #6B7280; margin-bottom: 24px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 5px; }
    input, select { width: 100%; padding: 11px 14px; border: 1.5px solid #E5E7EB; border-radius: 10px; font-size: 14px; font-family: inherit; }
    input:focus, select:focus { outline: none; border-color: #6A2BD9; }
    .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    .largura-total { grid-column: span 2; }
    button { width: 100%; margin-top: 22px; padding: 14px; background: #6A2BD9; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .erro { background: #FEE2E2; color: #DC2626; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 14px; }
    .sucesso { text-align: center; padding: 12px 0; }
    .sucesso h2 { font-size: 20px; margin-bottom: 10px; color: #3B0D6F; }
    .sucesso p { font-size: 14px; color: #6B7280; line-height: 1.7; }
    @media (max-width: 480px) { .grade { grid-template-columns: 1fr; } .largura-total { grid-column: span 1; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCJx1RwX5-FM2wcUqzeC_CYAUdkmTKU2u4",
      authDomain: "psicoworking.firebaseapp.com",
      projectId: "psicoworking",
      storageBucket: "psicoworking.firebasestorage.app",
      messagingSenderId: "176262015536",
      appId: "1:176262015536:web:4c72df01b83ba6f6995bf5"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const functions = firebase.functions();
    const chamarAutoCadastro = functions.httpsCallable("autoCadastroPaciente");
  </script>

  <script type="text/babel" data-presets="react">
    const { useState } = React;

    function pegarPsiIdDaUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("psi") || "";
    }

    function App() {
      const psiId = pegarPsiIdDaUrl();
      const [form, setForm] = useState({});
      const [enviando, setEnviando] = useState(false);
      const [erro, setErro] = useState("");
      const [enviado, setEnviado] = useState(false);

      if (!psiId) {
        return (
          <div className="cartao">
            <h1>Link inválido</h1>
            <p className="subtitulo">Este link de cadastro está incompleto. Peça um novo link para a sua psicóloga.</p>
          </div>
        );
      }

      async function aoEnviar(evento) {
        evento.preventDefault();
        setErro("");
        if (!form.nome || !form.email) {
          setErro("Nome e e-mail são obrigatórios.");
          return;
        }
        setEnviando(true);
        try {
          await chamarAutoCadastro({ psiId, ...form });
          // Manda o link de definir senha direto pro e-mail do paciente
          // (não passa pela psicóloga nem por aqui — ver CLAUDE.md REGRA 9).
          await auth.sendPasswordResetEmail(form.email).catch(() => {});
          setEnviado(true);
        } catch (e) {
          setErro(e.message || "Não foi possível enviar o cadastro. Tente novamente.");
        } finally {
          setEnviando(false);
        }
      }

      if (enviado) {
        return (
          <div className="cartao sucesso">
            <h2>🦋 Cadastro enviado!</h2>
            <p>
              Seus dados chegaram com sucesso.<br />
              Enviamos um e-mail para <strong>{form.email}</strong> com um link para você criar sua senha de acesso.<br /><br />
              A psicóloga vai analisar seus dados antes do primeiro atendimento.<br /><br />
              Obrigado pela confiança!
            </p>
          </div>
        );
      }

      return (
        <div className="cartao">
          <h1>Formulário de Cadastro</h1>
          <p className="subtitulo">Preencha seus dados para agilizar o seu atendimento. Leva menos de 2 minutos.</p>
          <form onSubmit={aoEnviar}>
            <div className="grade">
              <div className="largura-total">
                <label>Nome completo</label>
                <input value={form.nome || ""} onChange={(e) => setForm({ ...form, nome: e.target.value })} required />
              </div>
              <div>
                <label>E-mail</label>
                <input type="email" value={form.email || ""} onChange={(e) => setForm({ ...form, email: e.target.value })} required />
              </div>
              <div>
                <label>WhatsApp / Telefone</label>
                <input type="tel" value={form.telefone || ""} onChange={(e) => setForm({ ...form, telefone: e.target.value })} />
              </div>
              <div>
                <label>Data de Nascimento</label>
                <input type="date" value={form.dataNasc || ""} onChange={(e) => setForm({ ...form, dataNasc: e.target.value })} />
              </div>
              <div>
                <label>CPF</label>
                <input value={form.cpf || ""} onChange={(e) => setForm({ ...form, cpf: e.target.value })} />
              </div>
              <div className="largura-total">
                <label>Gênero</label>
                <select value={form.genero || ""} onChange={(e) => setForm({ ...form, genero: e.target.value })}>
                  <option value="">Selecione</option>
                  <option>Feminino</option>
                  <option>Masculino</option>
                  <option>Não-binário</option>
                  <option>Não informar</option>
                </select>
              </div>
            </div>

            {erro && <p className="erro">{erro}</p>}

            <button type="submit" disabled={enviando}>
              {enviando ? "Enviando..." : "Enviar Cadastro"}
            </button>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
