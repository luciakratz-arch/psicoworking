<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#6A2BD9" />
  <title>Área do Membro — Dra. Lucia Kratz</title>
  <link rel="manifest" href="/instalar/manifest.webmanifest" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    :root { --escuro:#3B0D6F; --principal:#6A2BD9; --claro:#A97BEF; --lavanda:#EADDFC; --grafite:#1F1B2E; --cinza:#6B7280; --fundo:#F3F4F6; --ok:#059669; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "DM Sans", system-ui, sans-serif; background: var(--fundo); color: var(--grafite); min-height: 100vh; }
    a { color: var(--principal); }
    button { font-family: inherit; cursor: pointer; }
    .topo { background: var(--escuro); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 10; }
    .topo b { font-size: 16px; }
    .topo button { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-size: 13px; }
    main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 22px; margin-bottom: 4px; } h2 { font-size: 18px; margin: 18px 0 10px; }
    .sub { color: var(--cinza); font-size: 14px; margin-bottom: 16px; line-height: 1.5; }
    .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .cartao { background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid #E5E7EB; cursor: pointer; text-align: left; padding: 0; }
    .cartao:hover { border-color: var(--claro); }
    .cartao .capa { aspect-ratio: 16/10; background: var(--lavanda) center/cover; }
    .cartao .info { padding: 12px 14px 14px; }
    .cartao .tipo { font-size: 11px; color: var(--cinza); text-transform: uppercase; letter-spacing: .05em; }
    .cartao .nome { font-weight: 700; font-size: 15px; margin-top: 3px; }
    .caixa { background: #fff; border-radius: 16px; padding: 24px; max-width: 420px; margin: 8vh auto 0; border: 1px solid #E5E7EB; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--cinza); margin: 14px 0 5px; text-transform: uppercase; letter-spacing: .04em; }
    input { width: 100%; padding: 12px 14px; border: 1.5px solid #E5E7EB; border-radius: 10px; font: inherit; }
    input:focus { outline: none; border-color: var(--principal); }
    .btn { display: inline-block; background: var(--principal); color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 600; font-size: 14px; text-decoration: none; }
    .btn.largo { width: 100%; margin-top: 18px; } .btn.claro { background: #fff; color: var(--principal); border: 1.5px solid var(--principal); }
    .btn:disabled { opacity: .6; }
    .erro { background: #FEF2F2; color: #B91C1C; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
    .ok { background: #ECFDF5; color: #047857; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
    .link { background: none; border: 0; color: var(--principal); font-size: 13px; margin-top: 12px; text-decoration: underline; }
    .curso { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: start; }
    @media (max-width: 820px) { .curso { grid-template-columns: 1fr; } }
    .player { background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
    .player iframe { width: 100%; height: 100%; border: 0; }
    .lista { background: #fff; border-radius: 12px; border: 1px solid #E5E7EB; overflow: hidden; }
    .lista .mod { padding: 12px 14px; font-weight: 700; font-size: 13px; background: #FAF7FF; border-bottom: 1px solid #E5E7EB; }
    .aula { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: #fff; border: 0; border-bottom: 1px solid #F3F4F6; padding: 11px 14px; font-size: 13.5px; }
    .aula.ativa { background: var(--lavanda); font-weight: 600; }
    .aula .tick { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #D1D5DB; flex: none; }
    .aula.feita .tick { background: var(--ok); border-color: var(--ok); }
    .materiais a { display: block; margin: 6px 0; }
    .voltar { background: none; border: 0; color: var(--principal); font-weight: 600; font-size: 14px; margin-bottom: 12px; }
    .leitor { max-width: 760px; margin: 0 auto; }
    .pag { position: relative; margin-bottom: 14px; background: #fff; border-radius: 6px; overflow: hidden; user-select: none; -webkit-user-select: none; }
    .pag img { width: 100%; display: block; pointer-events: none; -webkit-touch-callout: none; }
    .pag .marca { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font-size: 15px; color: rgba(31,27,46,.13); transform: rotate(-24deg); text-align: center; line-height: 1.8; }
    .vazio { color: var(--cinza); text-align: center; padding: 40px 10px; }
    .moldura { width: 100%; height: 75vh; border: 1px solid #E5E7EB; border-radius: 12px; background: #fff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    var FIREBASE_CONFIG = {
      apiKey: "AIzaSyCJx1RwX5-FM2wcUqzeC_CYAUdkmTKU2u4", authDomain: "psicoworking.firebaseapp.com",
      projectId: "psicoworking", storageBucket: "psicoworking.appspot.com",
      messagingSenderId: "176262015536", appId: "1:176262015536:web:placeholder"
    };
    var app = firebase.initializeApp(FIREBASE_CONFIG, "membro");
    var auth = app.auth(), db = app.firestore();
    var raiz = document.getElementById("app");
    var usuario = null, produtos = [], progresso = {};

    function h(tag, attrs, filhos) {
      var el = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) {
        if (k === "onclick") el.onclick = attrs[k];
        else if (k === "style" || k === "className") el[k] = attrs[k];
        else if (k === "html") el.innerHTML = attrs[k];
        else el.setAttribute(k, attrs[k]);
      });
      [].concat(filhos || []).forEach(function (f) { if (f == null) return; el.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
      return el;
    }
    function limpar() { raiz.innerHTML = ""; }
    function topo() {
      return h("div", { className: "topo" }, [
        h("b", {}, "Dra. Lucia Kratz · Área do Membro"),
        h("button", { onclick: function () { auth.signOut(); } }, "Sair")
      ]);
    }
    var TIPOS = { curso: "Curso", livro: "Livro", teste: "Mapeamento" };

    // ── Entrar ──
    function telaEntrar(msg, tipoMsg) {
      limpar();
      var email = h("input", { type: "email", autocomplete: "username", placeholder: "seu e-mail" });
      var senha = h("input", { type: "password", autocomplete: "current-password", placeholder: "sua senha" });
      var caixaMsg = h("div", {}, []);
      if (msg) caixaMsg = h("div", { className: tipoMsg === "ok" ? "ok" : "erro" }, msg);
      var entrar = h("button", { className: "btn largo" }, "Entrar");
      entrar.onclick = function () {
        entrar.disabled = true;
        auth.signInWithEmailAndPassword(email.value.trim(), senha.value).catch(function () {
          telaEntrar("E-mail ou senha incorretos. Se for o seu primeiro acesso, use o link que enviamos por e-mail para criar a senha.");
        });
      };
      senha.onkeydown = function (e) { if (e.key === "Enter") entrar.click(); };
      var esqueci = h("button", { className: "link" }, "Criar ou recuperar minha senha");
      esqueci.onclick = function () {
        if (!email.value.trim()) { telaEntrar("Digite o seu e-mail acima e toque de novo em \"Criar ou recuperar minha senha\"."); return; }
        auth.sendPasswordResetEmail(email.value.trim()).then(function () {
          telaEntrar("Se esse e-mail tiver acesso, enviamos o link para criar a senha. Confira também o spam.", "ok");
        }).catch(function () { telaEntrar("Não foi possível enviar. Confira o e-mail digitado."); });
      };
      raiz.appendChild(h("div", { className: "caixa" }, [
        h("h1", {}, "Área do Membro"), h("p", { className: "sub" }, "Dra. Lucia Kratz. Entre para ver os seus cursos, livros e bônus."),
        h("label", {}, "E-mail"), email, h("label", {}, "Senha"), senha, caixaMsg, entrar, esqueci
      ]));
    }

    // ── Biblioteca ──
    async function carregarBiblioteca() {
      limpar(); raiz.appendChild(topo());
      var main = h("main", {}, [h("h1", {}, "Meus produtos"), h("p", { className: "sub" }, "Carregando...")]);
      raiz.appendChild(main);
      try {
        var acessos = await db.collection("membros").doc(usuario.uid).collection("acessos").get();
        var lista = [];
        for (var i = 0; i < acessos.docs.length; i++) {
          var d = await db.collection("produtos_membro").doc(acessos.docs[i].id).get();
          if (d.exists && d.data().ativo !== false) lista.push(Object.assign({ id: d.id }, d.data()));
        }
        lista.sort(function (a, b) { return (a.ordem || 0) - (b.ordem || 0); });
        produtos = lista;
        var snap = await db.collection("membros").doc(usuario.uid).collection("progresso").get();
        progresso = {}; snap.forEach(function (x) { progresso[x.id] = !!x.data().concluida; });
      } catch (e) { main.innerHTML = ""; main.appendChild(h("div", { className: "erro" }, "Não foi possível carregar. Tente de novo em instantes.")); return; }
      main.innerHTML = "";
      main.appendChild(h("h1", {}, "Meus produtos"));
      if (!produtos.length) { main.appendChild(h("p", { className: "vazio" }, "Você ainda não tem produtos liberados. Se acabou de comprar, aguarde alguns minutos e atualize a página.")); return; }
      main.appendChild(h("p", { className: "sub" }, "Toque em um produto para abrir."));
      var grade = h("div", { className: "grade" });
      produtos.forEach(function (p) {
        grade.appendChild(h("button", { className: "cartao", onclick: function () { abrirProduto(p); } }, [
          h("div", { className: "capa", style: p.capa ? "background-image:url('" + p.capa + "')" : "" }),
          h("div", { className: "info" }, [h("div", { className: "tipo" }, TIPOS[p.tipo] || "Produto"), h("div", { className: "nome" }, p.titulo || "")])
        ]));
      });
      main.appendChild(grade);
    }

    function abrirProduto(p) { if (p.tipo === "livro") abrirLivro(p); else abrirCurso(p); }
    function voltarBtn() { return h("button", { className: "voltar", onclick: carregarBiblioteca }, "← Meus produtos"); }

    // ── Livro: leitura na tela, sem botão de baixar ──
    function abrirLivro(p) {
      limpar(); raiz.appendChild(topo());
      var leitor = h("div", { className: "leitor" });
      var marca = (usuario.displayName || "") + " " + usuario.email;
      var paginas = p.paginas || [];
      if (!paginas.length) leitor.appendChild(h("p", { className: "vazio" }, "O livro ainda está sendo preparado."));
      paginas.forEach(function (url, i) {
        leitor.appendChild(h("div", { className: "pag", oncontextmenu: "return false" }, [
          h("img", { src: url, alt: "Página " + (i + 1), loading: "lazy", draggable: "false" }),
          h("div", { className: "marca", html: "" }, [h("span", {}, "Leitura de " + marca)])
        ]));
      });
      [].forEach.call(leitor.children, function (el) { el.addEventListener("contextmenu", function (e) { e.preventDefault(); }); });
      raiz.appendChild(h("main", {}, [voltarBtn(), h("h1", {}, p.titulo || ""), h("p", { className: "sub" }, "Leitura exclusiva para o titular do acesso."), leitor]));
    }

    // ── Curso: módulos, aulas, bônus ──
    async function abrirCurso(p) {
      limpar(); raiz.appendChild(topo());
      var main = h("main", {}, [voltarBtn(), h("h1", {}, p.titulo || ""), h("p", { className: "sub" }, "Carregando...")]);
      raiz.appendChild(main);
      var mods, aulas;
      try {
        var base = db.collection("produtos_membro").doc(p.id);
        var rm = await base.collection("modulos").get(), ra = await base.collection("aulas").get();
        mods = rm.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).sort(function (a, b) { return (a.ordem || 0) - (b.ordem || 0); });
        aulas = ra.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).sort(function (a, b) { return (a.ordem || 0) - (b.ordem || 0); });
      } catch (e) { main.appendChild(h("div", { className: "erro" }, "Não foi possível abrir este produto.")); return; }
      main.innerHTML = "";
      main.appendChild(voltarBtn()); main.appendChild(h("h1", {}, p.titulo || ""));
      if (p.descricao) main.appendChild(h("p", { className: "sub" }, p.descricao));
      if (!aulas.length) { main.appendChild(h("p", { className: "vazio" }, "O conteúdo está sendo preparado.")); return; }
      var palco = h("div", {}), lateral = h("div", { className: "lista" });
      main.appendChild(h("div", { className: "curso" }, [palco, lateral]));
      var atual = aulas[0];
      function pintarLista() {
        lateral.innerHTML = "";
        mods.forEach(function (m) {
          var doMod = aulas.filter(function (a) { return a.moduloId === m.id; });
          if (!doMod.length) return;
          lateral.appendChild(h("div", { className: "mod" }, m.titulo || "Módulo"));
          doMod.forEach(function (a) {
            lateral.appendChild(h("button", { className: "aula" + (a.id === atual.id ? " ativa" : "") + (progresso[a.id] ? " feita" : ""), onclick: function () { atual = a; mostrar(); } },
              [h("span", { className: "tick" }), h("span", {}, a.titulo || "Aula")]));
          });
        });
      }
      function mostrar() {
        pintarLista(); palco.innerHTML = "";
        var a = atual;
        if (a.tipo === "link" && a.url) palco.appendChild(h("iframe", { className: "moldura", src: a.url, title: a.titulo || "" }));
        else if (a.bunnyVideoId && p.bunnyLibraryId) palco.appendChild(h("div", { className: "player" }, [h("iframe", { src: "https://iframe.mediadelivery.net/embed/" + p.bunnyLibraryId + "/" + a.bunnyVideoId + "?preload=true", allow: "accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture", allowfullscreen: "true" })]));
        else palco.appendChild(h("div", { className: "player", style: "display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px" }, "Vídeo em preparação"));
        palco.appendChild(h("h2", {}, a.titulo || ""));
        if (a.descricao) palco.appendChild(h("p", { className: "sub", html: "" }, a.descricao));
        if ((a.materiais || []).length) {
          var mat = h("div", { className: "materiais" }, [h("h2", {}, "Materiais")]);
          a.materiais.forEach(function (x) { mat.appendChild(h("a", { href: x.url, target: "_blank", rel: "noopener" }, x.nome || "Material")); });
          palco.appendChild(mat);
        }
        var concl = h("button", { className: "btn" + (progresso[a.id] ? " claro" : ""), style: "margin-top:14px" }, progresso[a.id] ? "Aula concluída (desmarcar)" : "Concluir aula");
        concl.onclick = function () {
          var novo = !progresso[a.id]; progresso[a.id] = novo;
          db.collection("membros").doc(usuario.uid).collection("progresso").doc(a.id).set({ concluida: novo, em: firebase.firestore.FieldValue.serverTimestamp() });
          mostrar();
        };
        palco.appendChild(concl);
      }
      mostrar();
    }

    auth.onAuthStateChanged(function (u) {
      usuario = u;
      if (!u) telaEntrar(); else carregarBiblioteca();
    });
  </script>
</body>
</html>
