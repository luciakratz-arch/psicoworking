      gambling: {
        rotulo: "Transtorno de Apostas (Gambling)",
        instrucao: "Pense no comportamento de apostar dinheiro nos últimos 12 meses.",
        perguntas: [
          "Você precisa apostar valores cada vez maiores para sentir a mesma emoção?",
          "Você fica irritado(a) ou ansioso(a) quando tenta parar de apostar?",
          "Você já tentou controlar ou parar de apostar sem sucesso?",
          "Você pensa em apostas com frequência (formas de ganhar, relembrar apostas passadas)?",
          "Você aposta quando se sente angustiado(a), culpado(a) ou ansioso(a)?",
          "Após perder dinheiro, você volta para tentar recuperar ('correr atrás')?",
          "Você mente sobre suas apostas para pessoas próximas?",
          "Você perdeu um relacionamento, emprego ou oportunidade importante por causa das apostas?",
          "Você depende de outras pessoas para dinheiro causado por dívidas das apostas?",
        ],
      },
      anorexia: {
        rotulo: "Anorexia Nervosa",
        instrucao: "Pense em sua relação com o peso, a comida e o seu corpo.",
        perguntas: [
          "Você restringe muito a quantidade que come, resultando em peso corporal muito baixo?",
          "Você tem medo intenso de engordar ou toma medidas para evitar ganhar peso?",
          "Você vê seu corpo de forma distorcida — se vê gordo(a) mesmo com peso baixo?",
          "Você não reconhece a seriedade do seu baixo peso?",
          "Seu peso ou formato corporal influencia muito na forma como você se avalia?",
        ],
      },
      bulimia: {
        rotulo: "Bulimia / TCA (Transtorno de Compulsão Alimentar)",
        instrucao: "Pense em episódios de comer exageradamente e em comportamentos com o peso.",
        perguntas: [
          "Você tem episódios recorrentes de comer exageradamente em curto período — muito mais do que a maioria das pessoas?",
          "Você sente que perde o controle sobre o que come durante esses episódios?",
          "Após esses episódios, você faz comportamentos para compensar (vomitar, tomar laxante, jejuar, se exercitar em excesso)?",
          "Sua autoestima é muito influenciada pelo seu peso e formato corporal?",
          "Você sente vergonha ou culpa intensa após esses episódios?",
        ],
      },
    };

    const { useState, useEffect, useRef } = React;

    function FormDiagnostico() {
      const [fase, setFase] = useState("carregando"); // carregando | erro | intro | form | obrigado
      const [cfg, setCfg] = useState(null);
      const [token, setToken] = useState("");
      const [respostas, setRespostas] = useState({});
      const [moduloAtual, setModuloAtual] = useState(0);
      const [obsFinais, setObsFinais] = useState("");
      const [enviando, setEnviando] = useState(false);
      const [msgErro, setMsgErro] = useState("");
      const topoRef = useRef(null);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const t = params.get("token");
        if (!t) { setMsgErro("Link inválido — token ausente."); setFase("erro"); return; }
        setToken(t);
        db.collection("clinica_rastreamento_tokens").doc(t).get()
          .then((snap) => {
            if (!snap.exists) { setMsgErro("Link inválido ou expirado."); setFase("erro"); return; }
            const data = snap.data();
            if (data.usado) { setMsgErro("Este questionário já foi respondido."); setFase("erro"); return; }
            const validade = data.validade?.seconds ? new Date(data.validade.seconds * 1000) : null;
            if (validade && validade < new Date()) { setMsgErro("Este link expirou. Solicite um novo à sua psicóloga."); setFase("erro"); return; }
            setCfg(data);
            setFase("intro");
          })
          .catch(() => { setMsgErro("Erro ao carregar o questionário. Tente novamente."); setFase("erro"); });
      }, []);

      function scrollTopo() {
        if (topoRef.current) topoRef.current.scrollIntoView({ behavior: "smooth" });
      }

      function responder(chave, valor) {
        setRespostas((prev) => {
          const atual = prev[chave];
          if (atual === valor) {
            const { [chave]: _, ...resto } = prev;
            return resto;
          }
          return { ...prev, [chave]: valor };
        });
      }

      const modulos = (cfg?.hipoteses || []).filter((id) => BANCO_PERGUNTAS[id]);
      const moduloInfo = modulos[moduloAtual] ? BANCO_PERGUNTAS[modulos[moduloAtual]] : null;
      const perguntasModulo = moduloInfo?.perguntas || [];
      const chavesModulo = perguntasModulo.map((_, i) => modulos[moduloAtual] + "_" + i);
      const totalRespondidas = chavesModulo.filter((k) => respostas[k]).length;
      const progresso = perguntasModulo.length > 0 ? totalRespondidas / perguntasModulo.length : 0;

      async function enviar() {
        setEnviando(true);
        try {
          const docRespostas = {};
          modulos.forEach((hipId) => {
            const ps = BANCO_PERGUNTAS[hipId]?.perguntas || [];
            ps.forEach((_, i) => {
              const k = hipId + "_" + i;
              if (respostas[k]) docRespostas[k] = respostas[k];
            });
          });
          await db.collection("clinica_rastreamento_diagnostico").add({
            psi_id: cfg.psi_id,
            pacienteId: cfg.pacienteId,
            pacienteNome: cfg.pacienteNome || "",
            grupoId: cfg.grupoId,
            grupoTitulo: cfg.grupoTitulo || "",
            hipoteses: modulos,
            token,
            respostas: docRespostas,
            obsFinais: obsFinais.trim(),
            criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
          });
          await db.collection("clinica_rastreamento_tokens").doc(token).update({ usado: true });
          setFase("obrigado");
        } catch (e) {
          alert("Erro ao enviar. Tente novamente.\n" + e.message);
        } finally {
          setEnviando(false);
        }
      }

      if (fase === "carregando") {
        return (
          <div className="container">
            <div className="centro">
              <div className="spinner"></div>
              <p className="subtitulo">Carregando questionário...</p>
            </div>
          </div>
        );
      }

      if (fase === "erro") {
        return (
          <div className="container">
            <div className="card centro">
              <h1 style={{ fontSize: 18, marginBottom: 10 }}>Link não disponível</h1>
              <p className="subtitulo">{msgErro}</p>
            </div>
          </div>
        );
      }

      if (fase === "obrigado") {
        return (
          <div className="container">
            <div className="card centro">
              <div style={{ width: 52, height: 52, borderRadius: "50%", background: "#F0FDF4", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px", fontSize: 28, color: "#16A34A" }}>&#10003;</div>
              <h1 style={{ fontSize: 20, marginBottom: 10 }}>Respostas enviadas!</h1>
              <p className="subtitulo">
                Obrigado por responder com honestidade. Suas respostas já estão disponíveis para a sua psicóloga.
              </p>
            </div>
          </div>
        );
      }

      if (fase === "intro") {
        const primeiroNome = (cfg.pacienteNome || "").split(" ")[0] || "Olá";
        return (
          <div className="container">
            <div className="card">
              <h1>Questionário Clínico</h1>
              <p className="subtitulo" style={{ marginBottom: 20 }}>
                Olá, <strong>{primeiroNome}</strong>! Sua psicóloga preparou um questionário clínico personalizado para você.
              </p>
              <div style={{ background: "#F5F3FF", borderRadius: 10, padding: "12px 16px", marginBottom: 20 }}>
                <p style={{ fontSize: 12.5, color: "#4B5563", lineHeight: 1.6 }}>
                  Este questionário é <strong>confidencial</strong> — as respostas vão diretamente para o prontuário clínico.<br />
                  Responda com honestidade. Não há respostas certas ou erradas.
                  <br /><br />
                  <strong>Como responder:</strong><br />
                  <strong style={{ color: "#374151" }}>N</strong> = Não / Nunca<br />
                  <strong style={{ color: "#92400E" }}>B</strong> = Às vezes / Parcialmente<br />
                  <strong style={{ color: "#166534" }}>C</strong> = Sim / Claramente
                </p>
              </div>
              <div style={{ fontSize: 13, color: "#6B7280", marginBottom: 20 }}>
                Módulos: <strong style={{ color: "#111827" }}>{modulos.map((id) => BANCO_PERGUNTAS[id]?.rotulo || id).join(", ")}</strong>
              </div>
              <button className="btn-primario" onClick={() => setFase("form")}>
                Começar questionário
              </button>
            </div>
          </div>
        );
      }

      // fase === "form"
      const hipId = modulos[moduloAtual];
      const isUltimoModulo = moduloAtual === modulos.length - 1;

      function avancarModulo() {
        if (isUltimoModulo) {
          setFase("resumo");
        } else {
          setModuloAtual((m) => m + 1);
          scrollTopo();
        }
      }

      if (fase === "resumo") {
        return (
          <div className="container" ref={topoRef}>
            <div className="card">
              <h2 style={{ marginBottom: 6 }}>Observações finais (opcional)</h2>
              <p className="subtitulo" style={{ marginBottom: 16 }}>
                Há algo que você queira acrescentar ou que considera importante a sua psicóloga saber?
              </p>
              <textarea
                value={obsFinais}
                onChange={(e) => setObsFinais(e.target.value)}
                placeholder="Escreva aqui (opcional)..."
              />
              <div className="nav-botoes" style={{ marginTop: 20 }}>
                <button className="btn-secundario" onClick={() => { setFase("form"); setModuloAtual(modulos.length - 1); }}>
                  Voltar
                </button>
                <button className="btn-primario" onClick={enviar} disabled={enviando}>
                  {enviando ? "Enviando..." : "Enviar respostas"}
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="container" ref={topoRef}>
          {/* Progresso geral */}
          <div style={{ marginBottom: 16, fontSize: 12, color: "#6B7280" }}>
            Módulo {moduloAtual + 1} de {modulos.length}: <strong style={{ color: "#111827" }}>{moduloInfo?.rotulo}</strong>
            <div className="progresso-bar" style={{ marginTop: 6 }}>
              <div
                className="progresso-fill"
                style={{ width: ((moduloAtual / modulos.length) * 100) + "%", background: "#6A2BD9" }}
              />
            </div>
          </div>

          <div className="card">
            {/* Header do módulo */}
            <div className="modulo-header">
              <span className="modulo-num" style={{ background: "#F5F3FF", color: "#6A2BD9" }}>
                {moduloAtual + 1}/{modulos.length}
              </span>
              <div>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{moduloInfo?.rotulo}</div>
                {moduloInfo?.instrucao && (
                  <div style={{ fontSize: 12, color: "#6B7280", marginTop: 3, lineHeight: 1.4 }}>{moduloInfo.instrucao}</div>
                )}
              </div>
            </div>

            {/* Progresso do módulo */}
            <div style={{ fontSize: 11, color: "#9CA3AF", marginBottom: 14, textAlign: "right" }}>
              {totalRespondidas}/{perguntasModulo.length} respondidas
              <div className="progresso-bar" style={{ marginTop: 4 }}>
                <div className="progresso-fill" style={{ width: (progresso * 100) + "%", background: "#16A34A" }} />
              </div>
            </div>

            {/* Perguntas */}
            {perguntasModulo.map((texto, i) => {
              const chave = hipId + "_" + i;
              const val = respostas[chave];
              return (
                <div key={chave} className="questao">
                  <div className="questao-texto">{i + 1}. {texto}</div>
                  <div className="opcoes">
                    {["N", "B", "C"].map((op) => (
                      <button
                        key={op}
                        type="button"
                        className={"opcao-btn" + (val === op ? " ativo-" + op : "")}
                        onClick={() => responder(chave, op)}
                      >
                        {op === "N" ? "N — Não" : op === "B" ? "B — Às vezes" : "C — Sim"}
                      </button>
                    ))}
                  </div>
                  {i < perguntasModulo.length - 1 && <hr className="divider" />}
                </div>
              );
            })}

            <div className="nav-botoes">
              <button
                className="btn-secundario"
                onClick={() => { if (moduloAtual > 0) { setModuloAtual((m) => m - 1); scrollTopo(); } else setFase("intro"); }}
              >
                Voltar
              </button>
              <button className="btn-primario" onClick={avancarModulo}>
                {isUltimoModulo ? "Finalizar" : "Próximo módulo"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<FormDiagnostico />);
  </script>
</body>
</html>
